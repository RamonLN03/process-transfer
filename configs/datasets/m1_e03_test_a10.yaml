# Registered for M1-E03 (docs/experiment_log.md; approved in D-042). Fixed and committed
# before any benchmark data exist. Development sets are generated in I6, and only after
# Codex has reviewed the registration; test sets are generated in I7, after the technical
# freeze (docs/m1_plan.md, section 13). Read by the generator only: sensor_master_seed is
# private and never reaches the available branch.
#
# test-A10: the fixed evaluation set at A10, eight runs of 10 excursions (plan, 5.2;
# D-011). Generated only after the technical freeze, and evaluated once.
#
# Target only (plan, section 5.2). P3 with the lead of 60 s and the amplitude A10 (D-039 to D-041).
# Excitation seeds and the master seed are new: none was used by an earlier experiment,
# test or smoke run (tests/test_m1_e03_definitions.py checks it). The noise stream of a
# run follows from its identity and the master seed (D-021). Sensors of D-020.
#
# Paths are relative to this file. Moved from configs/datasets/m1_e03_draft/ on
# 2026-10-17, which changed the two relative paths below and nothing else.
dataset_id: m1-e03-test-a10
description: M1-E03 test-A10, test runs of P3 with the lead at A10, eight runs of 10 excursions.
plants:
  - ../target_cstr.yaml
sensors: ../sensors_cstr.yaml
protocol: p3
n_excursions: 10
excitation_seeds: [33001, 33002, 33003, 33004, 33005, 33006, 33007, 33008]
lead: {value: 60, unit: s}
amplitude: a10
noise_realisation: 0
sensor_master_seed: 20261103
simulation_period: {value: 0.1, unit: s}
