# Registered for M1-E03 (docs/experiment_log.md; approved in D-042). Fixed and committed
# before any benchmark data exist. Development sets are generated in I6, and only after
# Codex has reviewed the registration; test sets are generated in I7, after the technical
# freeze (docs/m1_plan.md, section 13). Read by the generator only: sensor_master_seed is
# private and never reaches the available branch.
#
# test-steps: the eight single-input step tests of D-026 on the target, a new noise
# realisation (n1; m0-e07 used n0), one run per fixed condition (plan, 5.2 and 9.7).
# Generated only after the technical freeze, and evaluated once. Nothing is drawn at
# random for the inputs, so the identities name no excitation seed.
#
# Paths are relative to this file. Moved from configs/datasets/m1_e03_draft/ on
# 2026-10-17, which changed the two relative paths below and nothing else.
dataset_id: m1-e03-test-steps
description: M1-E03 test-steps, the eight single-input step tests of D-026 on the target, noise realisation 1.
plants:
  - ../target_cstr.yaml
sensors: ../sensors_cstr.yaml
protocol: step
lead: {value: 10.0, unit: min}
hold: {value: 10.0, unit: min}
recovery: {value: 10.0, unit: min}
inputs: [q, caf, tf, tc]
directions: [up, down]
noise_realisation: 1
sensor_master_seed: 20261105
simulation_period: {value: 0.1, unit: s}
