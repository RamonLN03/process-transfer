# The modeller's simplified physics and nominal parameter values: first-order
# Arrhenius kinetics and a constant heat-transfer conductance per plant.
# These are the textbook values (Seborg et al., Example 2.5) that a modeller
# fitting at the nominal point would recover (docs/decisions.md D-006).
# Nothing in this file is hidden.
kinetics:
  form: first_order
  k0: {value: 7.2e+10, unit: 1/min}
  activation_temperature: {value: 8750.0, unit: K}
heat_transfer:
  form: constant
  UA: {value: 1.0e+5, unit: J/(min*K)}
