[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "process-transfer"
version = "0.0.1"
description = "Physics-aware transfer of hybrid process models from data-rich to data-scarce plants"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ramón López Nieto" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "duckdb>=1.3",  # D-025: the external file cache setting, and the path tested from 1.3.0
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# the training of the learned models of M1 (D-035); the data path does not need it
learning = ["jax>=0.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A division by zero or an invalid operation inside numpy only warns and carries on
# with inf or NaN. In the test suite that is a failure (docs/numerical_robustness.md).
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
